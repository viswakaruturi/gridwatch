name: gridwatch-airflow

services:
  airflow:
    build:
      context: .
      dockerfile: Dockerfile
    image: gridwatch-airflow:local
    container_name: gridwatch-airflow
    command: standalone

    ports:
      - "127.0.0.1:8080:8080"

    env_file:
      - ../.env

    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      POSTGRES_HOST: "db"
      POSTGRES_PORT: "5432"

    volumes:
      - airflow_home:/opt/airflow
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ../ingestion:/opt/gridwatch/ingestion:ro
      - ../.state:/opt/gridwatch/.state
      - ../logs:/opt/gridwatch/logs
      - ../spark:/opt/spark/work-dir:ro
      - spark_checkpoints:/opt/spark/checkpoints

    networks:
      - default
      - gridwatch

    restart: unless-stopped

networks:
  gridwatch:
    external: true
    name: gridwatch_default

volumes:
  airflow_home:
  spark_checkpoints:
    external: true
    name: gridwatch_spark_checkpoints