  .sub { font-family:Arial,DejaVu Sans,sans-serif; fill:#cbd7e9; font-size:18px; text-anchor:middle }
  .label { font-family:Arial,DejaVu Sans,sans-serif; font-size:20px; font-weight:700; fill:#dbe6fa; text-anchor:middle }
  .heading { font-family:Arial,DejaVu Sans,sans-serif; font-size:31px; font-weight:700; fill:#fafbff }
  .small { font-family:Arial,DejaVu Sans,sans-serif; font-size:18px; fill:#aebfdb }
 </style>
</defs>
