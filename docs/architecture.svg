<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850" role="img" aria-label="GridWatch pipeline architecture: Airflow schedules ingestion from the EIA API, through Kafka and Spark into PostgreSQL, then quality checks, checkpointing, dashboard and API.">
<title>GridWatch: end-to-end data pipeline</title>
<defs>
 <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#93a6c6"/></marker>
 <style>
